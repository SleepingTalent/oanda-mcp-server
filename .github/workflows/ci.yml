name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # -------------------------------------------------------------------------
  # test — runs on every branch and PR
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest tests/unit/ -v

      - name: Build Docker image (tagged for integration tests)
        run: docker build -t oanda-mcp:ci .

      - name: Integration tests
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENVIRONMENT: practice
        run: uv run pytest tests/integration/ -v

  # -------------------------------------------------------------------------
  # publish — runs only on main branch push or version tags
  # -------------------------------------------------------------------------
  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oanda-mcp-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/oanda-mcp-server:${{ steps.version.outputs.value }}

      - name: Bump patch version
        id: bump
        run: |
          NEW_VERSION=$(python3 -c "
          v = '${{ steps.version.outputs.value }}'.split('.')
          v[2] = str(int(v[2]) + 1)
          print('.'.join(v))
          ")
          sed -i "s/^version = \"${{ steps.version.outputs.value }}\"/version = \"$NEW_VERSION\"/" pyproject.toml
          uv lock
          echo "value=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version to ${{ steps.bump.outputs.value }} [skip ci]"
          git push origin main
