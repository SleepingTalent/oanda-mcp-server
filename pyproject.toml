[project]
name = "oanda-mcp"
version = "0.1.0"
description = "FastMCP server wrapping the OANDA V20 REST API for AI agent trading"
readme = "README.md"
authors = [
    { name = "jamesfairbairn", email = "jaybono30@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
oanda-mcp = "oanda_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.0",
    "taskipy>=1.13",
    "ruff>=0.9",
    "mypy>=1.0",
]

[tool.taskipy.tasks]
serve = "docker compose up"
test = "pytest tests/unit/ tests/integration/"
smoke-test = "pytest tests/smoke/"
lint = "ruff check ."
typecheck = "mypy src/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.hatch.build.targets.wheel]
packages = ["src/oanda_mcp"]
